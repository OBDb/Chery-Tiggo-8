generations:
  - name: "First Generation"
    start_year: 2017
    end_year: 2019
    description: "The Chery Tiggo 8 is a mid-size crossover SUV that serves as the flagship of Chery's SUV lineup. First introduced in 2017 and revealed at the 2018 Beijing Auto Show, it is positioned between the smaller Chery Tiggo 7 and the larger Chery Tiggo 9. The first generation rides on a unibody chassis with MacPherson struts in front and multi-link rear suspension. It features a bold front fascia with a large hexagonal grille and sleek LED headlights. The initial models are powered by a 1.5L inline-four turbocharged petrol engine producing 108 kW (145 HP) and 210 Nm of torque, mated to a 6-speed dual-clutch transmission. For the 2019 model year, a 1.6L turbocharged petrol engine (290T variant) with 145 kW (197 HP) and 290 Nm of torque was added, paired with a 7-speed dual-clutch transmission. The interior offers three rows of seating for up to seven passengers with a 10.25-inch touchscreen infotainment system. The wheels are 18-inch size with 200 mm ground clearance."

  - name: "First Generation (Tiggo 8 Plus Facelift)"
    start_year: 2020
    end_year: 2024
    description: "Introduced in October 2020, the Tiggo 8 Plus is a more upmarket version of the first generation Tiggo 8 for the Chinese domestic market, marketed as Tiggo 8 Pro or Tiggo 8 Pro Max in overseas markets. The Plus variant features redesigned front and rear ends with the 'Life In Motion 3.0' design language, measuring 22 mm longer and 1 mm higher than the regular Tiggo 8. It is available in 5-, 6-, and 7-seater configurations with 18-inch and 19-inch redesigned alloy wheels. The interior features dual 12.3-inch displays with the LION 4.0 infotainment system and 8-speaker Sony stereo systems. Engine options include a 1.6L turbocharged engine with 145 kW (197 HP) mated to a 7-speed dual-clutch transmission, a mild hybrid 1.5L turbocharged engine (48V) with 156 HP paired with a CVT, and a 2.0L turbocharged engine (390T Kunpeng variant) with 187 kW (254 HP) and 390 Nm of torque. This variant represents significant visual and technical updates to the first-generation platform."

  - name: "Second Generation"
    start_year: 2024
    end_year: null
    description: "In April 2024, Chery introduced the all-new second generation Tiggo 8 (marketed as Tiggo 8 Plus II in China and as Tiggo 8 Pro in some overseas markets). This generation received a complete redesign with restyled front and rear fascia, new door panels with flush door handles, and a fully redesigned interior. The second generation retains the same T1X platform but with the new model code T18FL4. It is available in various configurations including the Fulwin T8 (launched in February 2025), which is the C-DM plug-in hybrid variant sold under the Fulwin NEV product series. Engine options include 1.6L and 2.0L turbocharged petrol engines, as well as Kunpeng plug-in hybrid powertrains. The Fulwin T8 hybrid variant is powered by a 1.5L engine with 115 kW (154 HP) combined with an electric motor and equipped with an 18.46 kWh or 18.66 kWh lithium iron phosphate battery, offering a pure electric range of 90 km. Additional features include 7-speed dual-clutch and 8-speed CVT transmissions, with assembly locations in China (Wuhu, Anhui) and Russia (Kaluga)."
